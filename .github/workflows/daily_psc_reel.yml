name: Daily Malayalam PSC Reel Automation

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-daily-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Malayalam Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-smc-manjari fonts-noto-core libharfbuzz-bin

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai edge-tts Pillow requests

      - name: Generate Malayalam PSC Explainer Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MALAYALAM_VOICE: "ml-IN-MidhunNeural"
        run: |
          python generate_psc_reel.py

      - name: Save updated topic history
        run: |
          if [ -f used_topics.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add used_topics.json
            git diff --staged --quiet || git commit -m "chore: update used PSC topics"
            git push
          fi

      - name: Upload Generated MP4 Reel
        uses: actions/upload-artifact@v4
        with:
          name: daily-malayalam-psc-reel
          path: output/*.mp4
          retention-days: 14
